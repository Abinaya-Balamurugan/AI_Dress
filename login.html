<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | AI Virtual Dress Recommendation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#edf4ff,#ffffff);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.container{

width:90%;
max-width:950px;

background:white;

display:flex;

border-radius:25px;

overflow:hidden;

box-shadow:0 15px 35px rgba(0,0,0,.15);

}

.left{

width:50%;

background:#002d72;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

}

.left img{

width:280px;

max-width:90%;

}

.right{

width:50%;

padding:50px;

display:flex;

flex-direction:column;

justify-content:center;

}

h2{

font-size:34px;

color:#002d72;

margin-bottom:10px;

}

p{

color:#666;

margin-bottom:30px;

}

.input-box{

margin-bottom:18px;

}

.input-box input{

width:100%;

padding:15px;

border:1px solid #ccc;

border-radius:10px;

font-size:16px;

outline:none;

transition:.3s;

}

.input-box input:focus{

border-color:#ff2f83;

}

.password{

display:flex;

align-items:center;

margin-bottom:20px;

font-size:14px;

color:#555;

}

.password input{

margin-right:8px;

}

button{

width:100%;

padding:15px;

background:#ff2f83;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#e60073;

}

.error{

color:red;

font-size:14px;

margin-bottom:15px;

}

.bottom{

margin-top:20px;

display:flex;

justify-content:space-between;

font-size:14px;

}

.bottom a{

text-decoration:none;

color:#002d72;

font-weight:600;

}

@media(max-width:768px){

.container{

flex-direction:column;

}

.left{

width:100%;

padding:25px;

}

.left img{

width:180px;

}

.right{

width:100%;

padding:30px;

}

h2{

text-align:center;

font-size:28px;

}

p{

text-align:center;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<img src="image/logo.png" alt="Logo">

</div>

<div class="right">

<h2>Welcome Back</h2>

<p>Login to continue your AI Virtual Shopping.</p>

<div class="error" id="error"></div>

<form id="loginForm">

<div class="input-box">

<input
type="email"
id="email"
placeholder="Enter Email"
required>

</div>

<div class="input-box">

<input
type="password"
id="password"
placeholder="Enter Password"
required>

</div>

<div class="password">

<input
type="checkbox"
id="showPassword">

<label for="showPassword">

Show Password

</label>

</div>

<button type="submit">

Login

</button>

</form>

<div class="bottom">

<a href="register.html">

Create Account

</a>

<a href="index.html">

Home

</a>

</div>

</div>

</div>

<script>

const form=document.getElementById("loginForm");

const error=document.getElementById("error");

const password=document.getElementById("password");

const show=document.getElementById("showPassword");

show.addEventListener("change",function(){

password.type=this.checked?"text":"password";

});

form.addEventListener("submit",function(e){

e.preventDefault();

let email=document.getElementById("email").value.trim();

let pass=password.value.trim();

if(email===""||pass===""){

error.innerHTML="Please enter Email and Password";

return;

}

error.innerHTML="";

localStorage.setItem("isLoggedIn","true");

localStorage.setItem("userEmail",email);

buttonLoading();

});

function buttonLoading(){

const btn=document.querySelector("button");

btn.innerHTML="Logging In...";

btn.disabled=true;

setTimeout(function(){

window.location.href="onboarding.html";

},1500);

}

</script>

</body>
</html>
