<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | AI Virtual Dress Recommendation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#edf4ff,#ffffff);

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

}

.container{

width:100%;
max-width:1050px;

display:flex;

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 15px 35px rgba(0,0,0,.15);

}

.left{

width:45%;

background:#002d72;

display:flex;
justify-content:center;
align-items:center;

padding:30px;

}

.left img{

width:90%;
max-width:320px;

}

.right{

width:55%;

padding:40px;

}

.right h2{

color:#002d72;

font-size:34px;

margin-bottom:10px;

}

.right p{

color:#666;

margin-bottom:25px;

}

.form-group{

margin-bottom:18px;

}

.form-group input{

width:100%;

padding:15px;

border:1px solid #ccc;

border-radius:10px;

font-size:16px;

outline:none;

transition:.3s;

}

.form-group input:focus{

border-color:#ff2f83;

box-shadow:0 0 8px rgba(255,47,131,.3);

}

.row{

display:flex;

gap:15px;

}

.row .form-group{

flex:1;

}

.register-btn{

width:100%;

padding:15px;

border:none;

background:#ff2f83;

color:white;

font-size:18px;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

.register-btn:hover{

background:#e60073;

}

.bottom{

margin-top:20px;

display:flex;

justify-content:space-between;

font-size:14px;

}

.bottom a{

text-decoration:none;

color:#002d72;

font-weight:600;

}

.login{

margin-top:20px;

text-align:center;

}

.login a{

text-decoration:none;

color:#ff2f83;

font-weight:bold;

}

@media(max-width:900px){

.container{

flex-direction:column;

}

.left{

width:100%;

padding:25px;

}

.left img{

width:220px;

}

.right{

width:100%;

padding:30px;

}

.row{

flex-direction:column;

gap:0;

}

.right h2{

text-align:center;

font-size:28px;

}

.right p{

text-align:center;

}

.bottom{

flex-direction:column;

gap:10px;

text-align:center;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<img src="image/logo.png" alt="Logo">

</div>

<div class="right">

<h2>Create Account</h2>

<p>Join AI Virtual Dress Recommendation Platform</p>

<form>

<div class="row">

<div class="form-group">
<input type="text" placeholder="First Name" required>
</div>

<div class="form-group">
<input type="text" placeholder="Last Name" required>
</div>

</div>

<div class="form-group">
<input type="email" placeholder="Email Address" required>
</div>

<div class="form-group">
<input type="tel" placeholder="Mobile Number" required>
</div>

<div class="form-group">
<input type="password" placeholder="Create Password" required>
</div>

<div class="form-group">
<input type="password" placeholder="Confirm Password" required>
</div>

<button type="submit" class="register-btn">
Create Account
</button>

<div class="bottom">

<a href="index.html">🏠 Home</a>

<a href="#">Privacy Policy</a>

</div>

<div class="login">

Already have an account?

<a href="login.html">Login</a>

</div>

</form>

</div>

</div>

</body>
</html>
